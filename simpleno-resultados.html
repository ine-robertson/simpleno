<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simpleno — Resultados de la encuesta</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --crema: #f7f4ef;
      --carbon: #1e1e1e;
      --gris: #6b6b6b;
      --gris-claro: #d4cfc9;
      --acento: #c17f5a;
      --verde: #5a8c6e;
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--crema);
      color: var(--carbon);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      padding: 0 1.5rem;
    }

    .contenedor { max-width: 800px; margin: 0 auto; padding: 4rem 0 8rem; }

    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .meta {
      font-size: 0.75rem;
      color: var(--gris);
      margin-bottom: 3rem;
      letter-spacing: 0.05em;
    }

    /* CARDS RESUMEN */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 3rem;
    }

    @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }

    .card {
      background: white;
      border: 1px solid var(--gris-claro);
      border-radius: 6px;
      padding: 1.2rem 1.5rem;
    }

    .card-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gris);
      margin-bottom: 0.4rem;
    }

    .card-valor {
      font-size: 2rem;
      font-weight: 300;
      color: var(--carbon);
    }

    .card-sub {
      font-size: 0.75rem;
      color: var(--gris);
      margin-top: 0.2rem;
    }

    /* SECCIONES */
    .seccion {
      margin-bottom: 3.5rem;
    }

    .seccion-titulo {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--acento);
      margin-bottom: 1.5rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--gris-claro);
    }

    /* FODA */
    .foda-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 600px) { .foda-grid { grid-template-columns: 1fr; } }
    .foda-cuadrante {
      border-radius: 6px;
      padding: 1.2rem 1.4rem;
    }
    .foda-cuadrante-titulo {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .foda-cuadrante ul { margin: 0; padding-left: 1.1rem; }
    .foda-cuadrante li { font-size: 0.82rem; line-height: 1.6; margin-bottom: 0.3rem; }
    .foda-f { background: #edf4f0; }
    .foda-f .foda-cuadrante-titulo { color: var(--verde); }
    .foda-o { background: #fdf3ec; }
    .foda-o .foda-cuadrante-titulo { color: var(--acento); }
    .foda-d { background: #f4eeed; }
    .foda-d .foda-cuadrante-titulo { color: var(--rojo); }
    .foda-a { background: #f4f2ea; }
    .foda-a .foda-cuadrante-titulo { color: var(--ambar); }
    .foda-loading { font-size: 0.82rem; color: var(--gris); font-style: italic; margin-top: 1rem; }

    /* BARRAS */
    .seccion-subtitulo {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gris);
      margin: 2rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--gris-claro);
    }

    .pregunta-bloque { margin-bottom: 2rem; }

    .pregunta-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--carbon);
      margin-bottom: 0.8rem;
    }

    .barra-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.5rem;
    }

    .barra-texto {
      font-size: 0.78rem;
      color: var(--carbon);
      width: 220px;
      flex-shrink: 0;
    }

    .barra-track {
      flex: 1;
      background: var(--gris-claro);
      border-radius: 2px;
      height: 8px;
      overflow: hidden;
    }

    .barra-fill {
      height: 100%;
      background: var(--acento);
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .barra-num {
      font-size: 0.72rem;
      color: var(--gris);
      width: 2.5rem;
      text-align: right;
      flex-shrink: 0;
    }

    .barra-item.ganador .barra-texto { font-weight: 700; color: var(--carbon); }
    .barra-item.ganador .barra-fill { background: var(--verde); }
    .barra-item.ganador .barra-num { font-weight: 700; color: var(--verde); }

    /* TEXTOS LIBRES CON AI */
    .texto-libre {
      background: white;
      border: 1px solid var(--gris-claro);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }

    .texto-libre-header {
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--gris-claro);
    }

    .texto-libre-pregunta {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--carbon);
      margin-bottom: 0.6rem;
    }

    .resumen-ia {
      font-size: 0.85rem;
      color: var(--carbon);
      line-height: 1.6;
      font-style: italic;
    }

    .resumen-ia-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--verde);
      margin-bottom: 0.3rem;
    }

    .respuestas-toggle {
      padding: 0.7rem 1.4rem;
      font-size: 0.72rem;
      color: var(--gris);
      cursor: pointer;
      user-select: none;
      border-top: 1px solid var(--gris-claro);
    }

    .respuestas-toggle:hover { color: var(--acento); }

    .respuestas-lista {
      display: none;
      padding: 0.5rem 1.4rem 1rem;
    }

    .respuestas-lista.visible { display: block; }

    .respuesta-item {
      font-size: 0.78rem;
      color: var(--gris);
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--gris-claro);
      line-height: 1.5;
    }

    .respuesta-item:last-child { border-bottom: none; }

    .respuesta-perfil {
      font-size: 0.65rem;
      color: var(--acento);
      font-weight: 600;
      margin-right: 0.5rem;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 4rem 0;
      color: var(--gris);
      font-size: 0.85rem;
    }

    .error {
      text-align: center;
      padding: 2rem;
      color: #8c5a5a;
      font-size: 0.85rem;
      background: white;
      border: 1px solid var(--gris-claro);
      border-radius: 6px;
    }

    /* AUTH WALL */
    #auth-wall {
      position: fixed;
      inset: 0;
      background: var(--crema);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 1.5rem;
    }

    #auth-wall .auth-titulo {
      font-family: 'Georgia', serif;
      font-size: 1.4rem;
      font-weight: normal;
      color: var(--carbon);
    }

    #auth-wall .auth-sub {
      font-size: 0.78rem;
      color: var(--gris);
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    #auth-error {
      display: none;
      font-size: 0.78rem;
      color: #8c5a5a;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
  </style>
</head>
<body>

<div id="auth-wall">
  <div class="auth-titulo">Simpleno — Resultados</div>
  <div class="auth-sub">Acceso restringido</div>
  <div id="google-btn"></div>
  <div id="auth-error">Tu cuenta no tiene permiso para ver esta página.</div>
</div>

<div id="app" style="display:none">
<div class="contenedor">

  <h1>Resultados de la encuesta</h1>
  <div class="meta" id="meta">Cargando...</div>

  <div id="contenido"><div class="loading">Obteniendo datos y generando resúmenes con IA...</div></div>

</div>
</div>

<script>
  var CLIENT_ID   = '308208183848-vf6v7s9je63uck58al8a590q48au3kr9.apps.googleusercontent.com';
  var EMAIL_OK    = 'robertson.ine@gmail.com';
  var GAS_URL     = 'https://script.google.com/macros/s/AKfycbwNdoby6fD6fl28i-YgTSDolDu17fRKW4jg3BdC8LR4AQkqnEGWDGSJsCp5ei-axx0u/exec';

  var SESSION_KEY = 'simpleno_auth';
  var SESSION_TTL = 30 * 24 * 60 * 60 * 1000; // 30 días

  function entrar() {
    document.getElementById('auth-wall').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    cargarDashboard();
  }

  window.onload = function() {
    var stored = localStorage.getItem(SESSION_KEY);
    if (stored) {
      try {
        var s = JSON.parse(stored);
        if (s.email === EMAIL_OK && (Date.now() - s.ts) < SESSION_TTL) {
          entrar();
          return;
        }
      } catch(e) {}
      localStorage.removeItem(SESSION_KEY);
    }

    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: function(response) {
        var payload = JSON.parse(atob(response.credential.split('.')[1]));
        if (payload.email === EMAIL_OK) {
          localStorage.setItem(SESSION_KEY, JSON.stringify({ email: EMAIL_OK, ts: Date.now() }));
          entrar();
        } else {
          document.getElementById('auth-error').style.display = 'block';
        }
      },
      auto_select: true
    });
    google.accounts.id.renderButton(document.getElementById('google-btn'), {
      theme: 'outline', size: 'large', locale: 'es'
    });
    google.accounts.id.prompt();
  };

  function cargarDashboard() {
    fetch(GAS_URL + '?action=dashboard')
      .then(function(r) { return r.json(); })
      .then(function(data) { render(data); })
      .catch(function() {
        document.getElementById('contenido').innerHTML =
          '<div class="error">No se pudo conectar con el servidor. Verificá el deployment del GAS.</div>';
      });
  }

  var SEMAFORO_CODIGOS = { nada: 'Para nada', puedeser: 'Puede ser', aveces: 'A veces', total: 'Totalmente' };

  var VALOR_ALIASES = {
    'Totalmente — si ayuda a otros, vale la pena': 'Totalmente — si aporta o habilita a otros, vale la pena'
  };

  // Retrocompatibilidad: mapea nombre nuevo de columna → nombre viejo
  var CAMPO_ALIASES = {
    '¿Tenés cosas que no contaste?':                                    'Q3 — Te guardás historias',
    '¿Las contarías anónimas?':                                         'Q1 — Historias anónimas',
    '¿Escribir ayuda a soltarlo o procesarlo?':                         'Qsoltar — Escribir ayuda a soltar',
    '¿Lo harías para ayudar a otros aunque no te sume a vos?':          'Q6 — Ayudar a otros',
    '¿Qué te frenaría al compartir con anonimato garantizado?':         'Q10 — Frenos al compartir',
    '¿Leerías historias de desconocidos?':                              'Lector — Leerías',
    '¿Alguna vez algo genuino contado por alguien que no conocías te movilizó?': 'Lector2 — Alguna vez te movilizó',
    '¿Qué te motivaría a empezar a leer algo personal de alguien que no conocés?': 'Motivar — Opciones',
    '¿Qué te haría abandonar una historia a la mitad?':                 'Abandonar — Opciones',
    '¿Qué tipo de experiencia te gustaría leer o compartir?':           'Qtipo — Tipo de historia',
    '¿Necesitás feedback o te alcanza saber que alguien te leyó?':      'Q11 — Feedback vs resonancia',
    '¿Cuánto te importa saber quién escribió algo?':                    'Q8 — Importa saber quién',
    '¿Alguna vez le contaste algo a una IA buscando que te escuche?':   'QIA — La IA como oyente',
    'IA: ¿Por qué nunca lo harías?':                                    'IA nunca — Por qué no',
    'IA: ¿Por qué sí lo hiciste?':                                      'IA sí — Por qué sí',
    'Primera reacción al concepto':                                     'Primera reacción',
    '¿Por qué te las guardás?':                                         'Q4 — Por qué te las guardás',
    '¿Qué cambia en una historia cuando no sabés quién la vivió?':      'Q7 — Qué cambia anónimo',
    '¿Qué te inspira o dice la palabra Simpleno?':                      'El nombre — Simpleno',
    'Cierre — todo lo que tengas para decir':                           'Cierre',
    'Profesión':                                                        'Perfil'
  };

  function getVal(r, campo) {
    return r[campo] || r[CAMPO_ALIASES[campo]] || '';
  }

  function normalizar(v) { v = SEMAFORO_CODIGOS[v] || v; return VALOR_ALIASES[v] || v; }

  function contar(rows, campo) {
    var counts = {};
    rows.forEach(function(r) {
      var vals = getVal(r, campo).split(' | ');
      vals.forEach(function(v) {
        v = normalizar(v.trim());
        if (v) counts[v] = (counts[v] || 0) + 1;
      });
    });
    return counts;
  }

  function barras(counts, total) {
    var entries = Object.entries(counts).sort(function(a, b) { return b[1] - a[1]; });
    var maxVal = entries.length ? entries[0][1] : 0;
    return entries.map(function(entry) {
        var pct = Math.round((entry[1] / total) * 100);
        var esGanador = entry[1] === maxVal && maxVal > 0;
        return '<div class="barra-item' + (esGanador ? ' ganador' : '') + '">'
          + '<div class="barra-texto">' + entry[0] + '</div>'
          + '<div class="barra-track"><div class="barra-fill" style="width:' + pct + '%"></div></div>'
          + '<div class="barra-num">' + entry[1] + ' / ' + total + '</div>'
          + '</div>';
      }).join('');
  }

  function textoLibre(campo, pregunta, rows, resumenes) {
    var textos = rows.filter(function(r) { return getVal(r, campo).trim().length > 2; });
    if (textos.length === 0) return '';

    var resumenTexto = resumenes[campo] || resumenes[CAMPO_ALIASES[campo]] || '';
    var resumen = resumenTexto
      ? '<div class="resumen-ia-label">Resumen IA</div><div class="resumen-ia">' + resumenTexto + '</div>'
      : '';

    var id = 'tl-' + campo.replace(/[^a-z]/gi, '');
    var items = textos.map(function(r) {
      return '<div class="respuesta-item">'
        + '<span class="respuesta-perfil">' + (getVal(r, 'Profesión') || '') + ' · ' + (r['Edad'] || '') + '</span>'
        + getVal(r, campo)
        + '</div>';
    }).join('');

    return '<div class="texto-libre">'
      + '<div class="texto-libre-header">'
      + '<div class="texto-libre-pregunta">' + pregunta + '</div>'
      + resumen
      + '</div>'
      + '<div class="respuestas-toggle" onclick="toggle(\'' + id + '\')" id="toggle-' + id + '">▸ Ver ' + textos.length + ' respuesta' + (textos.length > 1 ? 's' : '') + '</div>'
      + '<div class="respuestas-lista" id="' + id + '">' + items + '</div>'
      + '</div>';
  }

  function toggle(id) {
    var el = document.getElementById(id);
    var tog = document.getElementById('toggle-' + id);
    var visible = el.classList.toggle('visible');
    tog.textContent = (visible ? '▾ Ocultar' : '▸ Ver ' + el.children.length + ' respuesta' + (el.children.length > 1 ? 's' : ''));
  }

  function render(data) {
    if (data.error) {
      document.getElementById('contenido').innerHTML =
        '<div class="error">Error del servidor: ' + data.error + '<br><br>Verificá que el GAS tenga permiso para acceder al Sheet (ejecutá cualquier función desde el editor para autorizar).</div>';
      return;
    }

    if (data.total === 0) {
      document.getElementById('contenido').innerHTML = '<div class="error">Todavía no hay respuestas.</div>';
      return;
    }

    var rows = data.rows;
    var total = data.total;
    var res = data.resumenes || {};

    document.getElementById('meta').textContent =
      total + ' respuesta' + (total > 1 ? 's' : '') + ' · Última: ' + new Date(data.ultima).toLocaleDateString('es-AR');

    // Perfiles
    var perfiles = contar(rows, 'Profesión');
    var perfilTexto = Object.entries(perfiles).map(function(e) { return e[1] + ' ' + e[0]; }).join(' · ');

    var html = '';

    // Cards
    html += '<div class="cards" style="grid-template-columns:1fr 1fr">'
      + '<div class="card"><div class="card-label">Respuestas</div><div class="card-valor">' + total + '</div></div>'
      + '<div class="card"><div class="card-label">Perfiles</div><div class="card-valor">' + Object.keys(perfiles).length + '</div><div class="card-sub">' + perfilTexto + '</div></div>'
      + '</div>';

    // FODA
    if (data.foda) {
      var f = data.foda;
      function fodaItems(arr) {
        return '<ul>' + (arr||[]).map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ul>';
      }
      html += '<div class="seccion"><div class="seccion-titulo">Análisis FODA</div>'
        + '<div class="foda-grid">'
        + '<div class="foda-cuadrante foda-f"><div class="foda-cuadrante-titulo">Fortalezas</div>' + fodaItems(f.fortalezas) + '</div>'
        + '<div class="foda-cuadrante foda-o"><div class="foda-cuadrante-titulo">Oportunidades</div>' + fodaItems(f.oportunidades) + '</div>'
        + '<div class="foda-cuadrante foda-d"><div class="foda-cuadrante-titulo">Debilidades</div>' + fodaItems(f.debilidades) + '</div>'
        + '<div class="foda-cuadrante foda-a"><div class="foda-cuadrante-titulo">Amenazas</div>' + fodaItems(f.amenazas) + '</div>'
        + '</div></div>';
    } else {
      html += '<div class="seccion"><div class="seccion-titulo">Análisis FODA</div>'
        + '<div class="foda-loading">Disponible una vez que el GAS esté redeployado con la clave de Gemini.</div></div>';
    }

    // Edades — barras
    var edades = contar(rows, 'Edad');
    if (Object.keys(edades).length > 0) {
      html += '<div class="seccion"><div class="seccion-titulo">Distribución por edad</div>'
        + '<div class="pregunta-bloque">' + barras(edades, total) + '</div></div>';
    }

    // Preguntas cerradas
    html += '<div class="seccion"><div class="seccion-titulo">Preguntas cerradas</div>';

    var secciones = [
      {
        titulo: 'Lo que no se cuenta',
        preguntas: [
          { campo: '¿Tenés cosas que no contaste?', label: '¿Tenés cosas que te pasaron y no contaste?' },
          { campo: '¿Las contarías anónimas?', label: '¿Las contarías al menos de forma anónima?' },
        ]
      },
      {
        titulo: 'Lo que no se expresa',
        preguntas: [
          { campo: '¿Escribir ayuda a soltarlo o procesarlo?', label: '¿Creés o has experimentado que el simple hecho de escribir algo que te pasó, que te pesa o que te llenó te ayuda a procesarlo o a que trascienda?' },
          { campo: '¿Lo harías para ayudar a otros aunque no te sume a vos?', label: 'Aunque expresar una historia/testimonio no te agregue valor a vos — si pudieras aportar a alguien que está pasando por algo similar, ¿lo harías?' },
          { campo: '¿Qué te frenaría al compartir con anonimato garantizado?', label: '¿Qué te frenaría de compartir una historia/testimonio si tuvieras la garantía de que nadie sabría que es tuya?' },
        ]
      },
      {
        titulo: 'El lector',
        preguntas: [
          { campo: '¿Leerías historias de desconocidos?', label: '¿Leerías historias/experiencias de personas que no sabés quiénes son?' },
          { campo: '¿Alguna vez algo genuino contado por alguien que no conocías te movilizó?', label: '¿Alguna vez leíste o escuchaste algo personal contado de manera muy genuina por alguien que NO conocías, y te movilizó?' },
          { campo: '¿Qué te motivaría a empezar a leer algo personal de alguien que no conocés?', label: '¿Qué te motivaría a empezar a leer algo personal de alguien que no conocés?' },
          { campo: '¿Qué te haría abandonar una historia a la mitad?', label: '¿Qué te haría abandonar una historia/experiencia a la mitad?' },
          { campo: '¿Qué tipo de experiencia te gustaría leer o compartir?', label: '¿Qué tipo de experiencia te gustaría leer o compartir?' },
          { campo: '¿Necesitás feedback o te alcanza saber que alguien te leyó?', label: 'Si contás una historia/testimonio pero nadie te la puede comentar — ¿creés que pierde valor? ¿O con saber que hay alguien real del otro lado te alcanza?' },
        ]
      },
      {
        titulo: 'El anonimato',
        preguntas: [
          { campo: '¿Cuánto te importa saber quién escribió algo?', label: '¿Cuánto te importa saber quién escribió algo?' },
        ]
      },
      {
        titulo: 'La IA como oyente',
        preguntas: [
          { campo: '¿Alguna vez le contaste algo a una IA buscando que te escuche?', label: '¿Alguna vez le contaste algo a una IA (ChatGPT, Gemini u otra) buscando que te escuche o te diga qué opina?' },
          { campo: 'IA: ¿Por qué nunca lo harías?', label: '¿Por qué nunca lo consideraste?' },
          { campo: 'IA: ¿Por qué sí lo hiciste?', label: '¿Por qué lo hiciste?' },
        ]
      },
    ];

    secciones.forEach(function(s) {
      var bloques = '';
      s.preguntas.forEach(function(q) {
        var counts = contar(rows, q.campo);
        if (Object.keys(counts).length === 0) return;
        bloques += '<div class="pregunta-bloque">'
          + '<div class="pregunta-label">' + q.label + '</div>'
          + barras(counts, total)
          + '</div>';
      });
      if (bloques) {
        html += '<div class="seccion-subtitulo">' + s.titulo + '</div>' + bloques;
      }
    });

    html += '</div>';

    // Textos libres
    html += '<div class="seccion"><div class="seccion-titulo">Textos libres — resúmenes con IA</div>';

    var libres = [
      { campo: 'Primera reacción al concepto', label: '¿Cuál fue tu primera reacción?' },
      { campo: '¿Por qué te las guardás?', label: '¿Por qué te guardás cosas?' },
      { campo: '¿Qué cambia en una historia cuando no sabés quién la vivió?', label: '¿Qué cambiaría si pudieras contar algo anónimamente?' },
      { campo: '¿Qué te inspira o dice la palabra Simpleno?', label: '¿Qué te inspira o dice la palabra Simpleno?' },
      { campo: 'Cierre — todo lo que tengas para decir', label: '¿Algo más que quisieras decir?' },
    ];

    libres.forEach(function(q) {
      html += textoLibre(q.campo, q.label, rows, res);
    });

    html += '</div>';

    document.getElementById('contenido').innerHTML = html;
  }
</script>
